# Ma Golide autonomous DuckDB/CSV service, following Edge Factory's operating
# pattern. Canonical and direct-read state lives in the restored localdata
# cache. No Google credentials, external database, or worksheets are used.

name: "Ma Golide — 3-hour DuckDB service"

on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto-once | pregame-only"
        required: false
        default: "auto-once"
        type: choice
        options:
          - auto-once
          - pregame-only
      league:
        description: "NBA | EuroLeague"
        required: false
        default: "NBA"
        type: choice
        options:
          - NBA
          - EuroLeague
      date:
        description: "Slate date YYYY-MM-DD (blank = today, Africa/Johannesburg)"
        required: false
        default: ""
      allow_writes:
        description: "Must be true and ALLOW_MAGOLIDE_WRITES variable must also be true"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      send_notifications:
        description: "Send deduplicated WhatsApp heartbeat (requires writes and notification opt-in)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: magolide-duckdb-main
  cancel-in-progress: false

jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Africa/Johannesburg
      MAGOLIDE_WAREHOUSE: localdata/warehouse.duckdb
      PREDIXSPORT_API_KEY: ${{ secrets.PREDIXSPORT_API_KEY }}
      THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ALLOW_MAGOLIDE_WRITES: ${{ vars.ALLOW_MAGOLIDE_WRITES || 'false' }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
      ALLOW_NOTIFICATION_WRITES: ${{ vars.ALLOW_NOTIFICATION_WRITES || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'requests>=2.32' 'duckdb>=1.1,<2' \
            'gspread>=6.2' 'google-auth>=2.49' pytest

      - name: Restore DuckDB/CSV state
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: magolide-localdata-v1-${{ github.run_id }}
          restore-keys: |
            magolide-localdata-v1-

      - name: Hermetic regression tests
        run: python -m pytest tests -q

      - name: Resolve target date
        id: target
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Africa/Johannesburg date +%F)"; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Execute one autonomous iteration
        id: pipeline
        run: |
          set -euo pipefail
          ARGS=(--auto-once --date "${{ steps.target.outputs.date }}")
          ARGS+=(--league "${{ github.event.inputs.league || 'NBA' }}")
          if [ "${{ github.event.inputs.mode }}" = "pregame-only" ]; then
            ARGS+=(--skip-results)
          fi
          WRITE=0
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ALLOW_MAGOLIDE_WRITES" = "true" ]; then
            WRITE=1
          elif [ "${{ github.event.inputs.allow_writes }}" = "true" ] && [ "$ALLOW_MAGOLIDE_WRITES" = "true" ]; then
            WRITE=1
          fi
          if [ "$WRITE" = "1" ]; then
            ARGS+=(--write)
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$ALLOW_NOTIFICATION_WRITES" = "true" ]; then
              ARGS+=(--notify --send-notifications)
            elif [ "${{ github.event.inputs.send_notifications }}" = "true" ] && [ "$ALLOW_NOTIFICATION_WRITES" = "true" ]; then
              ARGS+=(--notify --send-notifications)
            fi
          else
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # A disabled scheduled service must not consume authenticated
              # provider quota without persisting state. Manual dry runs are
              # the deliberate live-coverage preview path.
              ARGS+=(--offline-fixture)
            fi
            echo "Dry run: canonical writes are disabled."
          fi
          python scripts/daily.py "${ARGS[@]}" | tee daily-output.json

      - name: Redacted operational summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('daily-output.json')
          if not path.exists():
              print('No daily report produced.')
          else:
              data = json.loads(path.read_text())
              summary = {key: data.get(key) for key in (
                  'run_id', 'target_date', 'league', 'mode', 'verification',
                  'system_of_record', 'counts', 'ledgers', 'notification',
                  'report_path'
              )}
              print('```json')
              print(json.dumps(summary, indent=2, default=str))
              print('```')
          PY

      - name: Persist DuckDB/CSV state
        uses: actions/cache/save@v4
        if: success()
        with:
          path: localdata
          key: magolide-localdata-v1-${{ github.run_id }}

      - name: Upload run reports and immutable ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaGolide-DuckDB-Reports-${{ github.run_id }}
          path: |
            localdata/reports/*.json
            localdata/ledgers/
            localdata/assay_*.json
            daily-output.json
          if-no-files-found: ignore
          retention-days: 14
