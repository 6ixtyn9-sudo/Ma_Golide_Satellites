# Ma Golide automatic multi-league acquisition, with no dispatch selections.
# - All six leagues retain their public/keyless paths by default.
# - Optional provider secrets are passed only to the adapters that already
#   support them; an absent secret leaves that adapter explicitly disabled.
# - Scheduled runs persist canonical state; manual dispatch remains a live
#   read-only rehearsal so it cannot advance canonical state by accident.
# Compact pick cards and paper-ticket state are committed to localdata/<league>;
# raw forecast JSON stays in cache/artifacts, not permanent Git history.
# Install as .github/workflows/ingestion.yml (editing that path requires the
# GitHub `workflows` permission).

name: "Ma Golide"

on:
  schedule:
    # Every three hours at minute 11 UTC. GitHub may delay scheduled runs.
    - cron: "11 */3 * * *"
  # Deliberately no league/date/mode/write inputs: one click runs everything.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: magolide-automatic-available-leagues
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Static checks
        run: ruff check .
      - name: Hermetic regression tests
        run: python -m pytest -q

  league:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One unavailable/failed league never cancels the other five.
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - label: NBA
            league: NBA
            state_key: nba
          - label: WNBA
            league: WNBA
            state_key: wnba
          - label: EuroLeague
            league: EuroLeague
            state_key: euroleague
          - label: Chinese CBA
            league: CBA
            state_key: cba
          - label: NCAA men
            league: NCAA_M
            state_key: ncaa_m
          - label: NCAA women
            league: NCAA_W
            state_key: ncaa_w
    name: ${{ matrix.label }}
    env:
      LOCALDATA: localdata/${{ matrix.state_key }}
      MAGOLIDE_WAREHOUSE: localdata/${{ matrix.state_key }}/warehouse.duckdb
      SPORTRADAR_ACCESS_LEVEL: "trial"
      # Optional credentials. Empty GitHub secrets stay empty and the adapter
      # records a disabled status in the pregame report; values are never
      # printed by the workflow or stored in localdata.
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
      ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      PREDIXSPORT_API_KEY: ${{ secrets.PREDIXSPORT_API_KEY }}
      ALLOW_MAGOLIDE_WRITES: "true"
      ALLOW_NOTIFICATION_WRITES: "false"

    steps:
      - name: Enable keyless public provider path
        id: capability
        env:
          LEAGUE: ${{ matrix.league }}
        run: |
          set -euo pipefail
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "$LEAGUE enabled with public keyless providers; paid integrations are disabled."

      - name: Check out repository
        if: steps.capability.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.capability.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        if: steps.capability.outputs.available == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Restore league-isolated DuckDB/CSV state
        if: steps.capability.outputs.available == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LOCALDATA }}
          key: magolide-localdata-${{ matrix.state_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The second prefix is a one-time fallback to the pre-rename snapshot.
          restore-keys: |
            magolide-localdata-${{ matrix.state_key }}-
            magolide-localdata-v4-${{ matrix.state_key }}-

      - name: Restore Git-durable operator reports after cache recovery
        if: steps.capability.outputs.available == 'true'
        run: |
          set -euo pipefail
          STATE_DIR="localdata/${{ matrix.state_key }}"
          # Runs are pinned to their event SHA, which may predate a serialized
          # publisher commit that added a frozen receipt. Fetch the
          # latest Git-authoritative operator state before using the cache.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_REF=refs/remotes/origin/main
          # Delete only Git-durable, compact operator state recovered from the
          # cache before restoring it. Full picks JSON and dated Markdown remain
          # cache/artifact-only, so preserve them across runs. Canonical data,
          # ledgers, nested evidence, and unapproved files are not touched.
          python - "$STATE_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          state_dir = Path(sys.argv[1])
          date = r"\d{4}-\d{2}-\d{2}"
          allowed = tuple(
              re.compile(pattern)
              for pattern in (
                  rf"picks_{date}\.txt",
                  r"auto_tickets_state\.json",
                  r"auto_tickets_performance\.json",
                  r"auto_tickets_performance\.txt",
                  rf"auto_tickets_{date}\.txt",
                  rf"auto_tickets_{date}_decision\.json",
                  rf"auto_tickets_{date}_withdrawn\.json",
              )
          )
          if state_dir.is_dir():
              for path in state_dir.iterdir():
                  if (
                      path.is_file()
                      and not path.is_symlink()
                      and any(pattern.fullmatch(path.name) for pattern in allowed)
                  ):
                      path.unlink()
          PY
          if git cat-file -e "${MAIN_REF}:${STATE_DIR}" 2>/dev/null; then
            git restore --source="$MAIN_REF" --worktree -- "$STATE_DIR"
          fi

      - name: Resolve league acquisition date automatically
        if: steps.capability.outputs.available == 'true'
        id: target
        env:
          LEAGUE: ${{ matrix.league }}
        run: |
          set -euo pipefail
          DATE="$(python - <<'PY'
          from datetime import datetime
          import os
          from zoneinfo import ZoneInfo
          from ingestion.pipeline import ACQUISITION_TZ
          league = os.environ["LEAGUE"].upper()
          print(datetime.now(ZoneInfo(ACQUISITION_TZ[league])).strftime("%Y-%m-%d"))
          PY
          )"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Execute every available stage automatically
        if: steps.capability.outputs.available == 'true'
        env:
          LEAGUE: ${{ matrix.league }}
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          ARGS=(
            --auto-once
            --league "$LEAGUE"
            --date "$TARGET_DATE"
            --warehouse "$MAGOLIDE_WAREHOUSE"
            --localdata "$LOCALDATA"
            --run-id "${GITHUB_RUN_ID}_${LEAGUE,,}_${GITHUB_RUN_ATTEMPT}"
          )

          # Scheduled runs may persist canonical state. Manual dispatch is a
          # deliberately live, all-league read-only rehearsal even when the
          # write switch is enabled; it can validate optional odds credentials
          # without advancing cursors or publishing canonical mutations.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ALLOW_MAGOLIDE_WRITES" = "true" ]; then
            ARGS+=(--write)
            if [ "$ALLOW_NOTIFICATION_WRITES" = "true" ]; then
              ARGS+=(--notify --send-notifications)
            fi
          else
            echo "Live dry run for $LEAGUE; canonical writes are disabled for this dispatch."
          fi

          python scripts/daily.py "${ARGS[@]}" | tee daily-output.json

      - name: Publish redacted operational summary
        if: always()
        env:
          LEAGUE: ${{ matrix.league }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          print(f"## {os.environ['LEAGUE']}")
          try:
              data = json.loads(Path("daily-output.json").read_text())
          except (OSError, ValueError):
              print("No valid daily report was produced; inspect the job log.")
          else:
              markets = data.get("markets") or {}
              walk_forward = markets.get("walk_forward") or {}
              accas = markets.get("accas") or {}
              price_coverage = {}
              for forecast in markets.get("forecasts") or []:
                  book = forecast.get("book") or {}
                  price = book.get("selected_decimal_price")
                  exact_price = (
                      isinstance(price, (int, float))
                      and not isinstance(price, bool)
                      and price > 1.0
                  )
                  state = (
                      "exact_selected_price"
                      if exact_price
                      else "matched_selected_price_missing"
                      if book
                      else "unmatched_market"
                  )
                  market_key = f"{forecast.get('market')}/{forecast.get('period')}"
                  price_coverage.setdefault(market_key, {}).setdefault(state, 0)
                  price_coverage[market_key][state] += 1
              pregame = (data.get("commands") or {}).get("pregame") or {}
              summary = {
                  key: data.get(key)
                  for key in (
                      "status", "reason", "capabilities", "run_id", "target_date",
                      "league", "mode", "verification", "system_of_record",
                      "counts", "ledgers", "notification", "report_path",
                      "market_report_path", "operator",
                  )
                  if key in data
              }
              summary["markets"] = {
                  "forecast_count": markets.get("forecast_count"),
                  "graded_walk_forward_forecasts": walk_forward.get("graded_forecasts"),
                  "acca_count": len(accas.get("results") or []),
                  "price_coverage_by_market_period": price_coverage,
                  "book_provider_status": pregame.get("book_provider_status") or {},
              }
              print("```json")
              print(json.dumps(summary, indent=2, default=str))
              print("```")
          PY

      - name: Persist league-isolated acquisition and canonical state
        if: >-
          success() &&
          steps.capability.outputs.available == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LOCALDATA }}
          key: magolide-localdata-${{ matrix.state_key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload league reports and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaGolide-${{ matrix.state_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            daily-output.json
            ${{ env.LOCALDATA }}/reports/*.json
            ${{ env.LOCALDATA }}/ledgers/
            ${{ env.LOCALDATA }}/assay_*.json
            ${{ env.LOCALDATA }}/picks_*.json
            ${{ env.LOCALDATA }}/picks_*.txt
            ${{ env.LOCALDATA }}/picks_audit_*.md
            ${{ env.LOCALDATA }}/auto_tickets_*.json
            ${{ env.LOCALDATA }}/auto_tickets_*.txt
            ${{ env.LOCALDATA }}/csv/*.csv.gz
          if-no-files-found: ignore
          retention-days: 14

  publish-localdata:
    name: Publish localdata to repository
    needs: league
    # Publish partial recovery evidence even if one matrix league fails. This is
    # derived operator state, independent of canonical ALLOW_MAGOLIDE_WRITES.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out latest repository operator state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download this run's league artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MaGolide-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magolide-artifacts

      - name: Merge derived league reports without deleting history
        run: |
          set -euo pipefail
          python scripts/publish_localdata.py \
            --artifacts "${{ runner.temp }}/magolide-artifacts" \
            --repo .

      - name: Commit and publish durable localdata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d localdata ]; then
            git add -A -- localdata
          fi
          if git diff --cached --quiet; then
            echo "No derived localdata changes to publish."
            exit 0
          fi
          git commit -m "chore: publish localdata run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"

          # Never force-push. A concurrent human/bot update is rebased first;
          # conflicting immutable receipts fail visibly for operator review.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Published localdata on attempt ${attempt}."
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "Could not publish localdata after three synchronized attempts." >&2
          exit 1
