[project]
name = "magolide-satellites"
version = "0.3.0"
description = "Headless DuckDB basketball acquisition, calibrated markets, and acca research"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
    "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["assayer*", "forecasting*", "ingestion*", "scripts*"]
exclude = ["localdata*", "tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
# Ordinary tests are hermetic: committed fixtures, sockets blocked by the
# conftest guard. Live smoke tests are explicit: pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: explicitly invoked live smoke tests (network, keyless, redacted)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
